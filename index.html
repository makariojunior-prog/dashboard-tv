<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #0f172a;
    color: #f1f5f9;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  * { box-sizing: border-box; }

  /* Live pulse dot */
  @keyframes pulse-live {
    0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.7); }
    50% { opacity: 0.85; transform: scale(1.1); box-shadow: 0 0 0 8px rgba(249, 115, 22, 0); }
  }
  .live-dot {
    animation: pulse-live 2s ease-in-out infinite;
  }

  /* Slide transition */
  #slide-content {
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  #slide-content.fading {
    opacity: 0;
    transform: translateY(8px);
  }

  /* Shimmer skeleton */
  @keyframes shimmer {
    0% { background-position: -1000px 0; }
    100% { background-position: 1000px 0; }
  }
  .skeleton {
    background: linear-gradient(90deg, #1e293b 0%, #334155 50%, #1e293b 100%);
    background-size: 2000px 100%;
    animation: shimmer 2s linear infinite;
    border-radius: 0.75rem;
  }

  /* Soft glow for highlighted items */
  .glow-brand {
    box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.4), 0 8px 24px -8px rgba(249, 115, 22, 0.35);
  }

  /* Hide scrollbars everywhere */
  ::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }

  /* Card hover-less elegance for TV */
  .card {
    background: #1e293b;
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 1rem;
  }

  /* Dot indicators */
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 9999px;
    background: #334155;
    transition: all 0.3s ease;
    cursor: pointer;
  }
  .dot.active {
    width: 32px;
    background: #f97316;
    box-shadow: 0 0 12px rgba(249, 115, 22, 0.6);
  }

  /* Subtle background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(249, 115, 22, 0.06) 0%, transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.25rem 0.75rem;
    border-radius: 9999px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* Spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid #334155;
    border-top-color: #f97316;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  /* PIN screen */
  #pin-screen {
    position: fixed;
    inset: 0;
    background: #0f172a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    gap: 2rem;
  }
  #pin-screen.hidden { display: none; }
  #pin-dots {
    display: flex;
    gap: 1rem;
  }
  .pin-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid #475569;
    background: transparent;
    transition: all 0.15s ease;
  }
  .pin-dot.filled {
    background: #f97316;
    border-color: #f97316;
    box-shadow: 0 0 12px rgba(249,115,22,0.6);
  }
  #pin-error {
    color: #ef4444;
    font-size: 0.875rem;
    font-weight: 600;
    min-height: 1.25rem;
    letter-spacing: 0.05em;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%,60%  { transform: translateX(-10px); }
    40%,80%  { transform: translateX(10px); }
  }
  .shake { animation: shake 0.4s ease; }

  /* Leaflet dark overrides */
  .leaflet-container { background: #0f172a; }
  .leaflet-tile-pane { filter: brightness(0.85) saturate(0.9); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: #1e293b; color: #f1f5f9; border: 1px solid rgba(255,255,255,0.08); border-radius: 0.75rem;
  }
  .leaflet-tooltip {
    background: #1e293b; color: #f1f5f9; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 0.5rem; padding: 0.4rem 0.6rem; box-shadow: 0 8px 24px rgba(0,0,0,0.4);

  .leaflet-tooltip-top::before { border-top-color: rgba(255,255,255,0.12); }
  .leaflet-control-zoom a { background:#1e293b; color:#f1f5f9; border-color:rgba(255,255,255,0.1); }

  .leaflet-control-attribution { background:rgba(15,23,42,0.7)!important; color:#64748b!important; }
  .leaflet-control-attribution a { color:#94a3b8; }
  #velo-map { border-radius: 1rem; }

<script>

/* ---------- PIN Gate ---------- */
let PIN_CODE = '2610'; // fallback enquanto carrega do Supabase

async function loadPinFromSupabase() {
  try {
    const { data } = await db.from('crm_config').select('value').eq('key', 'tv_dashboard_pin').single();
    if (data?.value) PIN_CODE = data.value;
  } catch (_) { /* usa fallback */ }
}

async function initPin() {
  await loadPinFromSupabase();

  const pinScreen = document.getElementById('pin-screen');
  const mainApp   = document.getElementById('main-app');

  // Já autenticado nesta sessão?
  if (sessionStorage.getItem('tv_auth') === PIN_CODE) {
    pinScreen.classList.add('hidden');
    mainApp.style.removeProperty('display');
    return;
  }

  let entered = '';

  function updateDots() {
    for (let i = 0; i < 4; i++) {
      document.getElementById('pd' + i).classList.toggle('filled', i < entered.length);
    }
  }

  function showError(msg) {
    const el = document.getElementById('pin-error');
    el.textContent = msg;
    const dots = document.getElementById('pin-dots');
    dots.classList.add('shake');
    setTimeout(() => dots.classList.remove('shake'), 450);
  }

  function tryUnlock() {
    if (entered === PIN_CODE) {
      sessionStorage.setItem('tv_auth', PIN_CODE);
      pinScreen.classList.add('hidden');
      mainApp.style.removeProperty('display');
    } else {
      showError('PIN incorreto. Tente novamente.');
      entered = '';
      updateDots();
    }
  }

  document.querySelectorAll('.pin-key').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.v;
      if (v === '⌫') {
        entered = entered.slice(0, -1);
        document.getElementById('pin-error').textContent = '';
      } else if (entered.length < 4) {
        entered += v;
        if (entered.length === 4) tryUnlock();
      }
      updateDots();
    });
  });

  // Suporte ao teclado físico
  document.addEventListener('keydown', (e) => {
    if (pinScreen.classList.contains('hidden')) return;
    if (e.key >= '0' && e.key <= '9' && entered.length < 4) {
      entered += e.key;
      if (entered.length === 4) tryUnlock();
      updateDots();
    } else if (e.key === 'Backspace') {
      entered = entered.slice(0, -1);
      document.getElementById('pin-error').textContent = '';
      updateDots();
    }
  });
}

const VT_BASE = 'https://track.velotrack.com.br/api/index.php';
const VT_USER = 'integracao@gmail.com';
const VT_PASS = '!Cantina26012019';

let _map = null;     // Leaflet map instance
let _mapPollTimer = null;

async function vtLogin() {
  const ts = Date.now();
  const passHash = md5(VT_PASS);
  const uidHash  = md5(`${VT_USER}:${passHash}:${ts}`);
  const ua = navigator.userAgent;
  const res = await fetch(`${VT_BASE}/login`, {

async function fetchRastreamento() {

function startMapPoll() {
  if (_mapPollTimer) return;
  _mapPollTimer = setInterval(async () => {
    try {
      const v = await fetchRastreamento();
      state.data.rastreamento = v;
      state.errors.rastreamento = false;
      if (SCREENS[state.currentSlide]?.id === 'rastreamento') afterMapRender();

  }, 30_000);
}

function stopMapPoll() {
  if (_mapPollTimer) { clearInterval(_mapPollTimer); _mapPollTimer = null; }
}

async function loadMapScreen() {
  if (state.loading.rastreamento) return;
  state.loading.rastreamento = true;
  state.errors.rastreamento = false;
  renderCurrentSlide();
  try {
    const v = await fetchRastreamento();
    state.data.rastreamento = v;
    state.loading.rastreamento = false;
  } catch (e) {
    console.error('VT load:', e);
    state.loading.rastreamento = false;
    state.errors.rastreamento = true;

function afterMapRender() {
  const mapEl = document.getElementById('velo-map');
  if (!mapEl) return;

  const vehicles = Array.isArray(state.data.rastreamento) ? state.data.rastreamento : [];

  if (_map) { _map.remove(); _map = null; }

  _map = L.map('velo-map', { zoomControl: true, scrollWheelZoom: false });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd', maxZoom: 19
  }).addTo(_map);

  const bounds = [];
  for (const v of vehicles) {
    const lat = parseFloat(v.latitude), lng = parseFloat(v.longitude);
    if (!isFinite(lat) || !isFinite(lng)) continue;
    bounds.push([lat, lng]);

    const online = v.connected === true || v.connected === 'Sim';
    const speed  = Number(v.speed) || 0;
    const color  = online ? '#22c55e' : '#64748b';

    const icon = L.divIcon({
      className: '',
      html: `<div style="background:${color};border:2px solid #fff;border-radius:50%;width:14px;height:14px;box-shadow:0 0 8px ${color}80;"></div>`,
      iconSize: [14, 14], iconAnchor: [7, 7]
    });

    const placa = escapeHtml(v.vehicle_code || '—');
    const nome  = escapeHtml(v.description  || '');
    const moto  = escapeHtml(v.driver       || '');
    const addr  = escapeHtml(v.address      || '');
    const tip = `<b style="font-size:13px">${placa}</b>${nome ? ` · ${nome}` : ''}<br>
      <span style="color:${color};font-weight:700">${online ? '🟢 Ligado' : '⚫ Desligado'}</span>
      ${moto ? `<br>👤 ${moto}` : ''}
      ${speed > 0 ? `<br>🚀 ${speed} km/h` : ''}
      ${addr ? `<br><span style="color:#94a3b8;font-size:10px">${addr}</span>` : ''}`;

    L.marker([lat, lng], { icon })
     .bindTooltip(tip, { direction: 'top', opacity: 0.97, className: '' })
     .addTo(_map);
  }

  if (bounds.length > 1) _map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
  else if (bounds.length === 1) _map.setView(bounds[0], 14);
  else _map.setView([-16.6869, -49.2648], 12);  // Goiânia fallback

  const now = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const onCnt = vehicles.filter(v => v.connected === true || v.connected === 'Sim').length;
  const infoEl = document.getElementById('vt-count');
  if (infoEl) infoEl.innerHTML =
    `<span class="text-3xl font-black text-white">${vehicles.length}</span>
     <span class="text-xs text-slate-500 block uppercase tracking-widest">veículo${vehicles.length !== 1 ? 's' : ''}</span>
     <span class="text-xs text-slate-400 mt-1 block">${onCnt} ligado${onCnt !== 1 ? 's' : ''} · ${now}</span>`;
}

/* ---------- Helpers ---------- */
function todayStr() {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

function nDaysAgoStr(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

function diaDaSemanaHoje() {
  return ['DOMINGO','SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO'][new Date().getDay()];
}

function formatCurrency(v) {
  const n = Number(v) || 0;
  return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function formatCurrencyShort(v) {
  const n = Number(v) || 0;
  if (n >= 1000) {
    return 'R$ ' + (n / 1000).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + 'k';
  }
  return formatCurrency(n);
}

function formatTime(value) {
  if (!value) return '--:--';
  // time string "HH:MM:SS" or "HH:MM"
  if (typeof value === 'string' && /^\d{2}:\d{2}/.test(value)) {
    return value.slice(0, 5);
  }
  try {
    const d = new Date(value);
    if (isNaN(d.getTime())) return '--:--';
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return `${hh}:${mm}`;
  } catch { return '--:--'; }
}

function formatRelativeDate(dateStr) {
  if (!dateStr) return '';
  const today = todayStr();
  const yest  = nDaysAgoStr(1);
  if (dateStr === today) return 'hoje';
  if (dateStr === yest)  return 'ontem';
  // dd/MM
  const parts = dateStr.split('T')[0].split('-');
  if (parts.length === 3) return `${parts[2]}/${parts[1]}`;
  return dateStr;
}

function truncate(text, max = 60) {
  if (!text) return '';
  const t = String(text).trim();
  return t.length > max ? t.slice(0, max - 1) + '…' : t;
}

function formatLongDate() {
  return new Date().toLocaleDateString('pt-BR', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

    db.from('varejo_pedidos')
      .select('origem, order_type, entregador, valor_liquido, status_icon')
      .eq('data_entrega', today),
    db.from('atacado_pedidos')
      .select('valor, ignorado, tipo, data_entrega')
      .eq('data_entrega', today)
      .eq('ignorado', false),
    db.from('varejo_pedidos')
      .select('num_pedido, cliente, bairro, origem')
      .eq('status_icon', '⚠️')
      .is('turno', null)
      .eq('origem', 'CARDAPIO WEB')
      .neq('order_type', 'takeout')
      .order('created_at', { ascending: false })
      .limit(50),
  ]);

  if (varejoRes.error) throw varejoRes.error;
  if (atacadoRes.error) throw atacadoRes.error;

  const varejoRaw = (varejoRes.data || []).filter(r => r.status_icon !== '❌');

  const buckets = {
    entrega:  { count: 0, valor: 0 },
    retirada: { count: 0, valor: 0 },
    ifood:    { count: 0, valor: 0 },
    food99:   { count: 0, valor: 0 },
  };

  for (const r of varejoRaw) {
    const origem = String(r.origem || '').toUpperCase();
    const orderType = String(r.order_type || '').toLowerCase();
    const entregador = String(r.entregador || '').toUpperCase();
    const valor = Number(r.valor_liquido) || 0;

    const is99    = origem === '99FOOD';
    const isIfood = origem === 'IFOOD';

    if (is99) {
      buckets.food99.count++;
      buckets.food99.valor += valor;
    } else if (isIfood) {
      buckets.ifood.count++;
      buckets.ifood.valor += valor;
    } else if (orderType === 'takeout' || entregador === 'RETIRADA') {
      buckets.retirada.count++;
      buckets.retirada.valor += valor;
    } else {
      buckets.entrega.count++;
      buckets.entrega.valor += valor;
    }
  }

  const varejoTotalCount = buckets.entrega.count + buckets.retirada.count + buckets.ifood.count + buckets.food99.count;
  const varejoTotalValor = buckets.entrega.valor + buckets.retirada.valor + buckets.ifood.valor + buckets.food99.valor;

  const atacadoRaw = (atacadoRes.data || []).filter(r => String(r.tipo || '').toUpperCase() !== 'CANCELADO');
  const atacadoCount = atacadoRaw.length;
  const atacadoValor = atacadoRaw.reduce((s, r) => s + (Number(r.valor) || 0), 0);

  const filaRaw = (filaRes.data || []).filter(r => String(r.entregador || '').toUpperCase() !== 'RETIRADA');

  return {
    varejo:  { buckets, totalCount: varejoTotalCount, totalValor: varejoTotalValor },
    atacado: { count: atacadoCount, valor: atacadoValor },
    fila:    filaRaw,
  };
}

async function fetchAgenda() {
  const today = todayStr();
  const { data, error } = await db.from('agenda_compromissos')
    .select('tipo, hora_inicio, cliente_nome, responsaveis, local, status')
    .eq('data', today)
    .neq('status', 'CANCELADO')
    .order('hora_inicio', { ascending: true })
    .limit(8);
  if (error) throw error;
  return data || [];
}

async function fetchRotas() {
  const today = todayStr();
  const { data, error } = await db
    .from('atacado_pedidos')
    .select('turno, entregador, cliente_nome, numero_pedido')
    .eq('data_entrega', today)
    .not('turno', 'is', null)
    .not('entregador', 'is', null)
    .order('turno')
    .order('entregador')
    .order('cliente_nome');
  if (error) throw error;
  return (data || []).filter(r => r.ignorado !== true);
}

async function fetchVisitas() {
  const sevenAgo = nDaysAgoStr(7);
  const { data, error } = await db.from('visits')
    .select('visit_date, visit_type, client_name, responsible, demand, report, priority, created_at')
    .gte('visit_date', sevenAgo)
    .order('visit_date', { ascending: false })
    .order('created_at', { ascending: false })
    .limit(6);
  if (error) throw error;
  return data || [];
}

async function fetchAlertas() {
  const [convRes, socialRes] = await Promise.all([
    db.from('crm_conversations')
      .select('categoria, nome, telefone, resumo, texto, received_at, conexao')
      .in('categoria', ['QUALIDADE', 'LOGÍSTICA', 'RECLAMAÇÃO'])
      .eq('visto', false)
      .eq('archived', false)
      .order('received_at', { ascending: false })
      .limit(8),
    db.from('crm_social_comments')
      .select('platform, account, username, nome, mensagem, categoria, received_at')
      .eq('status', 'NOVO')
      .order('received_at', { ascending: false })
      .limit(6),
  ]);
  if (convRes.error) throw convRes.error;
  return { conversas: convRes.data || [], social: socialRes.data || [] };
}

async function fetchAll() {
  const tasks = [
    ['pedidos', fetchPedidos],
    ['agenda',  fetchAgenda],
    ['rotas',   fetchRotas],
    ['visitas', fetchVisitas],
    ['alertas', fetchAlertas],
  ];

  // Mark all loading
  tasks.forEach(([key]) => { state.loading[key] = true; state.errors[key] = false; });

  const results = await Promise.allSettled(tasks.map(([, fn]) => fn()));

  tasks.forEach(([key], i) => {
    const r = results[i];
    state.loading[key] = false;
    if (r.status === 'fulfilled') {
      state.data[key] = r.value;
      state.errors[key] = false;
    } else {
      console.error(`[${key}] fetch error:`, r.reason);
      state.data[key] = null;
      state.errors[key] = true;
    }
  });

  renderCurrentSlide();
}

function renderRotas() {
  if (state.loading.rotas) return renderLoading('Carregando romaneio…');
  if (state.errors.rotas) return renderError();

  const list = state.data.rotas || [];
  const diaLabel = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'][new Date().getDay()];

  // Normalize turno string
  const normTurno = t => {
    const u = String(t || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    if (u === 'MANHA') return 'MANHÃ';
    if (u === 'TARDE') return 'TARDE';
    if (u === 'NOITE') return 'NOITE';
    return null;
  };

  // Group: turno → entregador → [clientes]
  const turnos = { 'MANHÃ': {}, 'TARDE': {}, 'NOITE': {} };
  let total = 0;

  for (const r of list) {
    const tk = normTurno(r.turno);
    const entregador = String(r.entregador || '').toUpperCase().trim();
    const cliente = String(r.cliente_nome || '').trim();
    if (!tk || !entregador || !cliente) continue;
    if (!turnos[tk][entregador]) turnos[tk][entregador] = [];
    turnos[tk][entregador].push(cliente);
    total++;
  }

  const hasNoite = Object.keys(turnos['NOITE']).length > 0;

  const renderDriverCard = (entregador, clientes, color) => `
    <div class="rounded-xl p-3 mb-2 last:mb-0" style="background:${color}12;border:1px solid ${color}35;">
      <div class="flex items-center justify-between mb-2">
        <div class="font-black text-sm tracking-widest" style="color:${color}">${escapeHtml(entregador)}</div>
        <div class="text-xs font-bold px-2 py-0.5 rounded-full" style="background:${color}25;color:${color}">${clientes.length}</div>
      </div>
      <div class="flex flex-col gap-1">
        ${clientes.map(c => `<div class="text-xs text-slate-300 px-2 py-1 rounded-lg bg-slate-800/60 truncate">${escapeHtml(c)}</div>`).join('')}
      </div>
    </div>
  `;

  const renderTurnoCol = (key, emoji, color) => {
    const drivers = turnos[key];
    const names = Object.keys(drivers).sort();
    const totalE = names.reduce((s, d) => s + drivers[d].length, 0);
    const content = names.length === 0
      ? `<div class="text-slate-500 italic text-sm mt-6 text-center">Sem entregas</div>`
      : names.map(d => renderDriverCard(d, drivers[d], color)).join('');
    return `
      <div class="card flex-1 flex flex-col p-5 relative overflow-hidden min-h-0">
        <div class="absolute top-0 left-0 right-0 h-1 rounded-t-xl" style="background:${color}"></div>
        <div class="flex items-center gap-3 mb-4">
          <div class="text-3xl">${emoji}</div>
          <div>
            <div class="text-xl font-black uppercase tracking-wider" style="color:${color}">${key}</div>
            <div class="text-xs text-slate-500 uppercase tracking-widest">
              ${names.length} entregador${names.length !== 1 ? 'es' : ''} · ${totalE} entrega${totalE !== 1 ? 's' : ''}
            </div>
          </div>
        </div>
        <div class="flex flex-col overflow-y-auto flex-1">${content}</div>
      </div>
    `;
  };

  const gridClass = hasNoite ? 'grid-cols-3' : 'grid-cols-2';

  return `
    <div class="flex items-end justify-between mb-4">
      <div>
        <div class="text-xs uppercase tracking-[0.3em] text-slate-500 font-bold">Logística</div>
        <div class="text-3xl font-bold text-white mt-1">Romaneio · ${escapeHtml(diaLabel)}</div>
      </div>
      <div class="text-right">
        <div class="text-xs uppercase tracking-widest text-slate-500">Entregas hoje</div>
        <div class="text-3xl font-black text-brand tabular-nums">${total}</div>
      </div>
    </div>
    <div class="grid ${gridClass} gap-6 flex-1 min-h-0">
      ${renderTurnoCol('MANHÃ', '🌅', '#f59e0b')}
      ${renderTurnoCol('TARDE', '☀️', '#3b82f6')}
      ${hasNoite ? renderTurnoCol('NOITE', '🌙', '#6366f1') : ''}
    </div>
  `;
}

/* ---------- Screen 4: Visitas ---------- */
function priorityStyle(p) {
  const v = String(p || '').toUpperCase();
  if (v === 'ALTA')  return { color: '#ef4444', label: 'ALTA',  bg: 'rgba(239,68,68,0.12)' };
  if (v === 'MÉDIA' || v === 'MEDIA') return { color: '#f59e0b', label: 'MÉDIA', bg: 'rgba(245,158,11,0.12)' };
  if (v === 'BAIXA') return { color: '#22c55e', label: 'BAIXA', bg: 'rgba(34,197,94,0.12)' };
  return { color: '#64748b', label: v || '—', bg: 'rgba(100,116,139,0.10)' };
}

function renderVisitas() {
  if (state.loading.visitas) return renderLoading('Carregando visitas…');
  if (state.errors.visitas) return renderError();

  const list = state.data.visitas || [];

  if (list.length === 0) {
    return `
      <div class="flex-1 flex flex-col items-center justify-center text-center">
        <div class="text-9xl mb-6 opacity-60">👣</div>
        <div class="text-4xl font-bold text-white mb-2">Sem visitas registradas</div>
        <div class="text-lg text-slate-400">Nenhuma visita nos últimos 7 dias</div>
      </div>
    `;
  }

  const cards = list.map(v => {
    const p = priorityStyle(v.priority);
    const dateLabel = formatRelativeDate(v.visit_date);
    const text = v.report || v.demand || '';
    return `
      <div class="card p-5 flex flex-col gap-3 relative overflow-hidden min-h-0"
           style="border-left:4px solid ${p.color};">
        <div class="flex items-center justify-between">
          <span class="badge" style="background:rgba(249,115,22,0.12); color:#fdba74; border:1px solid rgba(249,115,22,0.3);">
            ${escapeHtml(v.visit_type || '—')}
          </span>
          <span class="badge" style="background:${p.bg}; color:${p.color}; border:1px solid ${p.color}40;">
            ${escapeHtml(p.label)}
          </span>
        </div>
        <div>
          <div class="text-xl font-bold text-white truncate">${escapeHtml(v.client_name || 'Sem cliente')}</div>
          <div class="text-sm text-slate-400 mt-1 flex items-center gap-2">
            <span>👤 ${escapeHtml(v.responsible || '—')}</span>
            <span class="text-slate-600">·</span>
            <span class="text-brand font-semibold">${escapeHtml(dateLabel)}</span>
          </div>
        </div>
        <div class="text-sm text-slate-300 italic leading-snug">
          ${text ? `"${escapeHtml(truncate(text, 90))}"` : '<span class="text-slate-600">Sem relato</span>'}
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="flex items-end justify-between mb-4">
      <div>
        <div class="text-xs uppercase tracking-[0.3em] text-slate-500 font-bold">Comercial em Movimento</div>
        <div class="text-3xl font-bold text-white mt-1">Últimas visitas (7 dias)</div>
      </div>
      <div class="text-right">
        <div class="text-xs uppercase tracking-widest text-slate-500">Exibindo</div>
        <div class="text-3xl font-black text-brand tabular-nums">${list.length}</div>
      </div>
    </div>
    <div class="grid grid-cols-3 grid-rows-2 gap-5 flex-1 min-h-0">
      ${cards}
    </div>
  `;
}

/* ---------- Screen 5: Alertas ---------- */
function categoriaStyle(cat) {
  const c = String(cat || '').toUpperCase();
  if (c === 'RECLAMAÇÃO' || c === 'RECLAMACAO')
    return { color: '#ef4444', bg: 'rgba(239,68,68,0.15)', border: '#ef4444', label: 'RECLAMAÇÃO' };
  if (c === 'QUALIDADE')
    return { color: '#f97316', bg: 'rgba(249,115,22,0.15)', border: '#f97316', label: 'QUALIDADE' };
  if (c === 'LOGÍSTICA' || c === 'LOGISTICA')
    return { color: '#3b82f6', bg: 'rgba(59,130,246,0.15)', border: '#3b82f6', label: 'LOGÍSTICA' };
  return { color: '#64748b', bg: 'rgba(100,116,139,0.15)', border: '#64748b', label: c || '—' };
}

function conexaoStyle(con) {
  const c = String(con || '').toUpperCase();
  if (c === 'CANTINA')
    return { color: '#f59e0b', bg: 'rgba(245,158,11,0.12)', label: 'CANTINA' };
  if (c === 'LUMAR' || c === 'LUMAR_NOVOS')
    return { color: '#3b82f6', bg: 'rgba(59,130,246,0.12)', label: c === 'LUMAR_NOVOS' ? 'LUMAR (NOVOS)' : 'LUMAR' };
  return { color: '#64748b', bg: 'rgba(100,116,139,0.12)', label: c || '—' };
}

function platformStyle(platform) {
  const p = String(platform || '').toLowerCase();
  if (p === 'instagram') return { color: '#e1306c', bg: 'rgba(225,48,108,0.15)', label: 'INSTAGRAM' };
  if (p === 'facebook')  return { color: '#1877f2', bg: 'rgba(24,119,242,0.15)', label: 'FACEBOOK' };
  return { color: '#64748b', bg: 'rgba(100,116,139,0.15)', label: p.toUpperCase() || 'SOCIAL' };
}

function renderAlertas() {
  if (state.loading.alertas) return renderLoading('Carregando alertas…');
  if (state.errors.alertas) return renderError();

  const data = state.data.alertas || {};
  const conversas = data.conversas || [];
  const social    = data.social    || [];

  if (conversas.length === 0 && social.length === 0) {
    return `
      <div class="flex-1 flex flex-col items-center justify-center text-center">
        <div class="w-40 h-40 rounded-full bg-emerald-500/10 border-4 border-emerald-500/40 flex items-center justify-center mb-8">
          <div class="text-8xl">✅</div>
        </div>
        <div class="text-5xl font-black text-emerald-300 mb-3">Sem alertas críticos!</div>
        <div class="text-xl text-slate-400">Tudo certo por enquanto.</div>
      </div>
    `;
  }

  // ── Coluna esquerda: conversas ───────────────────────────────────
  const conversaContent = conversas.length === 0
    ? `<div class="flex-1 flex flex-col items-center justify-center text-center text-slate-500">
         <div class="text-5xl mb-2">✅</div>
         <div class="text-base font-semibold text-emerald-300">Sem alertas de conversas</div>
       </div>`
    : `<div class="flex flex-col gap-2.5 flex-1 min-h-0 overflow-hidden">
        ${conversas.map(a => {
          const c = categoriaStyle(a.categoria);
          const con = conexaoStyle(a.conexao);
          const time = formatTime(a.received_at);
          const dateRel = formatRelativeDate((a.received_at || '').split('T')[0]);
          return `
            <div class="card flex items-center gap-4 px-4 py-3" style="border-left:4px solid ${c.border};">
              <div class="w-36 shrink-0">
                <span class="badge text-[10px]" style="background:${c.bg}; color:${c.color}; border:1px solid ${c.border}60;">
                  ${escapeHtml(c.label)}
                </span>
              </div>
              <div class="w-20 shrink-0">
                <span class="badge text-[10px]" style="background:${con.bg}; color:${con.color}; border:1px solid ${con.color}40;">
                  ${escapeHtml(con.label)}
                </span>
              </div>
              <div class="flex-1 min-w-0">
                <div class="text-base font-bold text-white truncate">${escapeHtml(a.nome || a.telefone || 'Sem nome')}</div>
                <div class="text-xs text-slate-300 italic truncate">"${escapeHtml(truncate(a.resumo || a.texto || '', 70))}"</div>
              </div>
              <div class="text-right shrink-0">
                <div class="text-base font-black text-white tabular-nums">${escapeHtml(time)}</div>
                <div class="text-[10px] text-slate-500">${escapeHtml(dateRel)}</div>
              </div>
            </div>`;
        }).join('')}
       </div>`;

  // ── Coluna direita: redes sociais ────────────────────────────────
  const socialContent = social.length === 0
    ? `<div class="flex-1 flex flex-col items-center justify-center text-center text-slate-500">
         <div class="text-5xl mb-2">💬</div>
         <div class="text-base font-semibold text-emerald-300">Sem comentários pendentes</div>
       </div>`
    : `<div class="flex flex-col gap-2.5 flex-1 min-h-0 overflow-hidden">
        ${social.map(s => {
          const p = platformStyle(s.platform);
          const dateRel = formatRelativeDate((s.received_at || '').split('T')[0]);
          const time = formatTime(s.received_at);
          return `
            <div class="card flex items-center gap-4 px-4 py-3" style="border-left:4px solid ${p.color};">
              <div class="w-28 shrink-0">
                <span class="badge text-[10px]" style="background:${p.bg}; color:${p.color}; border:1px solid ${p.color}40;">
                  ${escapeHtml(p.label)}
                </span>
              </div>
              <div class="flex-1 min-w-0">
                <div class="text-xs font-bold text-slate-400 truncate">@${escapeHtml(s.username || s.nome || '—')}</div>
                <div class="text-sm text-slate-200 italic truncate">"${escapeHtml(truncate(s.mensagem || '', 65))}"</div>
              </div>
              <div class="text-right shrink-0">
                <div class="text-base font-black text-white tabular-nums">${escapeHtml(time)}</div>
                <div class="text-[10px] text-slate-500">${escapeHtml(dateRel)}</div>
              </div>
            </div>`;
        }).join('')}
       </div>`;

  return `
    <div class="grid grid-cols-12 gap-6 flex-1 min-h-0">

      <!-- CONVERSAS (7 cols) -->
      <div class="col-span-7 flex flex-col gap-3 min-h-0">
        <div class="flex items-end justify-between">
          <div>
            <div class="text-xs uppercase tracking-[0.3em] text-slate-500 font-bold">Atenção necessária</div>
            <div class="text-2xl font-bold text-white mt-1">Conversas em aberto</div>
          </div>
          <div class="text-right">
            <div class="text-xs uppercase tracking-widest text-slate-500">Pendentes</div>
            <div class="text-2xl font-black text-red-400 tabular-nums">${conversas.length}</div>
          </div>
        </div>
        ${conversaContent}
      </div>

      <!-- SOCIAL (5 cols) -->
      <div class="col-span-5 flex flex-col gap-3 min-h-0">
        <div class="flex items-end justify-between">
          <div>
            <div class="text-xs uppercase tracking-[0.3em] text-slate-500 font-bold">Redes Sociais</div>
            <div class="text-2xl font-bold text-white mt-1">Comentários sem resposta</div>
          </div>
          <div class="text-right">
            <div class="text-xs uppercase tracking-widest text-slate-500">Pendentes</div>
            <div class="text-2xl font-black tabular-nums" style="color:${social.length > 0 ? '#e1306c' : '#22c55e'}">${social.length}</div>
          </div>
        </div>
        ${socialContent}
      </div>

    </div>
  `;
}

/* ---------- Screen 6: Rastreamento ---------- */
function renderRastreamento() {
  if (state.loading.rastreamento) return renderLoading('Conectando ao Velotrack…');
  if (state.errors.rastreamento && !state.data.rastreamento) {
    return `
      <div class="flex-1 flex flex-col items-center justify-center gap-4 text-center">
        <div class="text-5xl">📡</div>
        <div class="text-xl font-bold text-slate-300">Sem conexão com Velotrack</div>
        <div class="text-sm text-slate-500 max-w-sm">Verifique se a API está acessível. Pode ser necessário um proxy por restrições de CORS.</div>
      </div>`;
  }
  const vehicles = Array.isArray(state.data.rastreamento) ? state.data.rastreamento : [];
  const onCnt = vehicles.filter(v => v.connected === true || v.connected === 'Sim').length;
  return `
    <div class="flex items-end justify-between mb-3">
      <div>
        <div class="text-xs uppercase tracking-[0.3em] text-slate-500 font-bold">Logística</div>
        <div class="text-3xl font-bold text-white mt-1">Rastreamento · Ao Vivo</div>
      </div>
      <div id="vt-count" class="text-right">
        <span class="text-3xl font-black text-white">${vehicles.length}</span>
        <span class="text-xs text-slate-500 block uppercase tracking-widest">veículo${vehicles.length !== 1 ? 's' : ''}</span>
        <span class="text-xs text-slate-400 mt-1 block">${onCnt} ligado${onCnt !== 1 ? 's' : ''}</span>
      </div>
    </div>
    <div id="velo-map" class="flex-1 rounded-2xl overflow-hidden" style="min-height:0;"></div>
  `;
}

/* ---------- Slide rendering ---------- */
function renderCurrentSlide() {
  const screen = SCREENS[state.currentSlide];
  const content = document.getElementById('slide-content');
  const screenName = document.getElementById('screen-name');
  const screenCurrent = document.getElementById('screen-current');

  let html = '';
  switch (screen.id) {
    case 'pedidos':       html = renderPedidos(); break;
    case 'agenda':        html = renderAgenda();  break;
    case 'rotas':         html = renderRotas();   break;
    case 'visitas':       html = renderVisitas(); break;
    case 'alertas':       html = renderAlertas(); break;
    case 'rastreamento':  html = renderRastreamento(); break;
  }

  content.innerHTML = html;
  screenName.textContent = screen.name;
  screenCurrent.textContent = state.currentSlide + 1;
  renderDots();

  // Map lifecycle
  const isMap = screen.id === 'rastreamento';
  if (isMap) {
    if (!_mapScreenActive) {
      _mapScreenActive = true;
      if (state.data.rastreamento === null && !state.loading.rastreamento && !state.errors.rastreamento) {
        loadMapScreen(); return; // loadMapScreen will re-render when done
      }
    }
    requestAnimationFrame(() => afterMapRender());
  } else {
    if (_mapScreenActive) {
      _mapScreenActive = false;
      stopMapPoll();
      if (_map) { _map.remove(); _map = null; }
    }
  }
}

function renderDots() {
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = SCREENS.map((s, i) =>
    `<div class="dot ${i === state.currentSlide ? 'active' : ''}" data-idx="${i}" title="${s.name}"></div>`
  ).join('');
  dotsEl.querySelectorAll('.dot').forEach(el => {
    el.addEventListener('click', () => {
      const idx = Number(el.dataset.idx);
      goToSlide(idx);
      resetRotation();
    });
  });
}

function goToSlide(n) {
  const total = SCREENS.length;
  const target = ((n % total) + total) % total;
  if (target === state.currentSlide) return;

  const content = document.getElementById('slide-content');
  content.classList.add('fading');
  setTimeout(() => {
    state.currentSlide = target;
    renderCurrentSlide();
    requestAnimationFrame(() => content.classList.remove('fading'));
  }, 400);
}

function startRotation() {
  if (state.rotationTimer) clearInterval(state.rotationTimer);
  state.rotationTimer = setInterval(() => {
    goToSlide(state.currentSlide + 1);
  }, SLIDE_DURATION);
}

function resetRotation() {
  startRotation();
}

/* ---------- Clock ---------- */
function updateClock() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  const ss = String(d.getSeconds()).padStart(2, '0');
  document.getElementById('clock-time').textContent = `${hh}:${mm}:${ss}`;
  document.getElementById('clock-date').textContent = formatLongDate();
}

function startClock() {
  updateClock();
  state.clockTimer = setInterval(updateClock, 1000);
}

/* ---------- Init ---------- */
function init() {
  document.getElementById('screen-total').textContent = SCREENS.length;
  startClock();
  renderCurrentSlide();   // show initial loading state
  fetchAll();
  setInterval(fetchAll, REFRESH_INTERVAL);
  startRotation();

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') {
      goToSlide(state.currentSlide - 1);
      resetRotation();
    } else if (e.key === 'ArrowRight') {
      goToSlide(state.currentSlide + 1);
      resetRotation();
    } else if (e.key === 'r' || e.key === 'R') {
      fetchAll();
    }
  });
}

async function bootstrap() {
  await initPin();
  // Se já autenticado, inicia o dashboard imediatamente;
  // caso contrário, o botão de desbloqueio chama startDashboard()
  const mainApp = document.getElementById('main-app');
  if (mainApp.style.display !== 'none') {
    init();
  } else {
    // Sobrescreve tryUnlock para também iniciar o dashboard
    const origStyle = mainApp.getAttribute('style');
    const observer = new MutationObserver(() => {
      if (!mainApp.style.display || mainApp.style.display === '') {
        observer.disconnect();
        init();
      }
    });
    observer.observe(mainApp, { attributes: true, attributeFilter: ['style'] });
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootstrap);
} else {
  bootstrap();
}
</script>
