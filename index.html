<script>

/* ---------- PIN Gate ---------- */
let PIN_CODE = '2610'; // fallback enquanto carrega do Supabase

async function loadPinFromSupabase() {
  try {
    const { data } = await db.from('crm_config').select('value').eq('key', 'tv_dashboard_pin').single();
    if (data?.value) PIN_CODE = data.value;
  } catch (_) { /* usa fallback */ }
}

async function initPin() {
  await loadPinFromSupabase();

  const pinScreen = document.getElementById('pin-screen');
  const mainApp   = document.getElementById('main-app');

  // Já autenticado nesta sessão?
  if (sessionStorage.getItem('tv_auth') === PIN_CODE) {
    pinScreen.classList.add('hidden');
    mainApp.style.removeProperty('display');
    return;
  }

  let entered = '';

  function updateDots() {
    for (let i = 0; i < 4; i++) {
      document.getElementById('pd' + i).classList.toggle('filled', i < entered.length);
    }
  }

  function showError(msg) {
    const el = document.getElementById('pin-error');
    el.textContent = msg;
    const dots = document.getElementById('pin-dots');
    dots.classList.add('shake');
    setTimeout(() => dots.classList.remove('shake'), 450);
  }

  function tryUnlock() {
    if (entered === PIN_CODE) {
      sessionStorage.setItem('tv_auth', PIN_CODE);
      pinScreen.classList.add('hidden');
      mainApp.style.removeProperty('display');
    } else {
      showError('PIN incorreto. Tente novamente.');
      entered = '';
      updateDots();
    }
  }

  document.querySelectorAll('.pin-key').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.v;
      if (v === '⌫') {
        entered = entered.slice(0, -1);
        document.getElementById('pin-error').textContent = '';
      } else if (entered.length < 4) {
        entered += v;
        if (entered.length === 4) tryUnlock();
      }
      updateDots();
    });
  });

  // Suporte ao teclado físico
  document.addEventListener('keydown', (e) => {
    if (pinScreen.classList.contains('hidden')) return;
    if (e.key >= '0' && e.key <= '9' && entered.length < 4) {
      entered += e.key;
      if (entered.length === 4) tryUnlock();
      updateDots();
    } else if (e.key === 'Backspace') {
      entered = entered.slice(0, -1);
      document.getElementById('pin-error').textContent = '';
      updateDots();
    }
  });
}

/* ---------- Helpers ---------- */
function todayStr() {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

function nDaysAgoStr(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

function diaDaSemanaHoje() {
  return ['DOMINGO','SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO'][new Date().getDay()];
}

function formatCurrency(v) {
  const n = Number(v) || 0;
  return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function formatCurrencyShort(v) {
  const n = Number(v) || 0;
  if (n >= 1000) {
    return 'R$ ' + (n / 1000).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + 'k';
  }
  return formatCurrency(n);
}

function formatTime(value) {
  if (!value) return '--:--';
  // time string "HH:MM:SS" or "HH:MM"
  if (typeof value === 'string' && /^\d{2}:\d{2}/.test(value)) {
    return value.slice(0, 5);
  }
  try {
    const d = new Date(value);
    if (isNaN(d.getTime())) return '--:--';
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return `${hh}:${mm}`;
  } catch { return '--:--'; }
}

function formatRelativeDate(dateStr) {
  if (!dateStr) return '';
  const today = todayStr();
  const yest  = nDaysAgoStr(1);
  if (dateStr === today) return 'hoje';
  if (dateStr === yest)  return 'ontem';
  // dd/MM
  const parts = dateStr.split('T')[0].split('-');
  if (parts.length === 3) return `${parts[2]}/${parts[1]}`;
  return dateStr;
}

function truncate(text, max = 60) {
  if (!text) return '';
  const t = String(text).trim();
  return t.length > max ? t.slice(0, max - 1) + '…' : t;
}

function formatLongDate() {
  return new Date().toLocaleDateString('pt-BR', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ---------- Data fetching ---------- */
async function fetchPedidos() {
  const today = todayStr();

  const [varejoRes, atacadoRes] = await Promise.all([
    db.from('varejo_pedidos')
      .select('origem, order_type, entregador, valor_liquido, status_icon')
      .eq('data_entrega', today),
    db.from('atacado_pedidos')
      .select('valor, ignorado, tipo, data_entrega')
      .eq('data_entrega', today)
      .eq('ignorado', false)
  ]);

  if (varejoRes.error) throw varejoRes.error;
  if (atacadoRes.error) throw atacadoRes.error;

  const varejoRaw = (varejoRes.data || []).filter(r => r.status_icon !== '❌');

  const buckets = {
    entrega:  { count: 0, valor: 0 },
    retirada: { count: 0, valor: 0 },
    ifood:    { count: 0, valor: 0 },
    food99:   { count: 0, valor: 0 },
  };

  for (const r of varejoRaw) {
    const origem = String(r.origem || '').toUpperCase();
    const orderType = String(r.order_type || '').toLowerCase();
    const entregador = String(r.entregador || '').toUpperCase();
    const valor = Number(r.valor_liquido) || 0;

    const is99    = origem === '99FOOD';
    const isIfood = origem === 'IFOOD';

    if (is99) {
      buckets.food99.count++;
      buckets.food99.valor += valor;
    } else if (isIfood) {
      buckets.ifood.count++;
      buckets.ifood.valor += valor;
    } else if (orderType === 'takeout' || entregador === 'RETIRADA') {
      buckets.retirada.count++;
      buckets.retirada.valor += valor;
    } else {
      buckets.entrega.count++;
      buckets.entrega.valor += valor;
    }
  }

  const varejoTotalCount = buckets.entrega.count + buckets.retirada.count + buckets.ifood.count + buckets.food99.count;
  const varejoTotalValor = buckets.entrega.valor + buckets.retirada.valor + buckets.ifood.valor + buckets.food99.valor;

  const atacadoRaw = (atacadoRes.data || []).filter(r => String(r.tipo || '').toUpperCase() !== 'CANCELADO');
  const atacadoCount = atacadoRaw.length;
  const atacadoValor = atacadoRaw.reduce((s, r) => s + (Number(r.valor) || 0), 0);

  return {
    varejo: { buckets, totalCount: varejoTotalCount, totalValor: varejoTotalValor },
    atacado: { count: atacadoCount, valor: atacadoValor }
  };
}

async function fetchAgenda() {
  const today = todayStr();
  const { data, error } = await db.from('agenda_compromissos')
    .select('tipo, hora_inicio, cliente_nome, responsaveis, local, status')
    .eq('data', today)
    .neq('status', 'CANCELADO')
    .order('hora_inicio', { ascending: true })
    .limit(8);
  if (error) throw error;
  return data || [];
}

async function fetchRotas() {
  const { data, error } = await db.from('crm_routes')
    .select('id, name, schedule, days_of_week, is_active')
    .eq('is_active', true);
  if (error) throw error;
  return data || [];
}

async function fetchVisitas() {
  const sevenAgo = nDaysAgoStr(7);
  const { data, error } = await db.from('visits')
    .select('visit_date, visit_type, client_name, responsible, demand, report, priority, created_at')
    .gte('visit_date', sevenAgo)
    .order('visit_date', { ascending: false })
    .order('created_at', { ascending: false })
    .limit(6);
  if (error) throw error;
  return data || [];
}

async function fetchAlertas() {
  const [convRes, socialRes] = await Promise.all([
    db.from('crm_conversations')
      .select('categoria, nome, telefone, resumo, texto, received_at, conexao')
      .in('categoria', ['QUALIDADE', 'LOGÍSTICA', 'RECLAMAÇÃO'])
      .eq('visto', false)
      .eq('archived', false)
      .order('received_at', { ascending: false })
      .limit(8),
    db.from('crm_social_comments')
      .select('platform, account, username, nome, mensagem, categoria, received_at')
      .eq('status', 'NOVO')
      .order('received_at', { ascending: false })
      .limit(6),
  ]);
  if (convRes.error) throw convRes.error;
  return { conversas: convRes.data || [], social: socialRes.data || [] };
}

async function fetchAll() {
  const tasks = [
    ['pedidos', fetchPedidos],
    ['agenda',  fetchAgenda],
    ['rotas',   fetchRotas],
    ['visitas', fetchVisitas],
    ['alertas', fetchAlertas],
  ];

  // Mark all loading
  tasks.forEach(([key]) => { state.loading[key] = true; state.errors[key] = false; });

  const results = await Promise.allSettled(tasks.map(([, fn]) => fn()));

  tasks.forEach(([key], i) => {
    const r = results[i];
    state.loading[key] = false;
    if (r.status === 'fulfilled') {
      state.data[key] = r.value;
      state.errors[key] = false;
    } else {
      console.error(`[${key}] fetch error:`, r.reason);
      state.data[key] = null;
      state.errors[key] = true;
    }
  });

  renderCurrentSlide();
}

/* ---------- Screen 2: Agenda ---------- */

    'REUNIÃO':             { bg: 'rgba(168,85,247,0.15)',  text: '#d8b4fe', border: '#a855f7' },
    'REUNIAO':             { bg: 'rgba(168,85,247,0.15)',  text: '#d8b4fe', border: '#a855f7' },
    'LIGAÇÃO':             { bg: 'rgba(34,197,94,0.15)',   text: '#86efac', border: '#22c55e' },
    'LIGACAO':             { bg: 'rgba(34,197,94,0.15)',   text: '#86efac', border: '#22c55e' },
    'DEGUSTAÇÃO':          { bg: 'rgba(244,63,94,0.15)',   text: '#fda4af', border: '#f43f5e' },
    'DEGUSTACAO':          { bg: 'rgba(244,63,94,0.15)',   text: '#fda4af', border: '#f43f5e' },
    'PROMOÇÃO':            { bg: 'rgba(236,72,153,0.15)',  text: '#f9a8d4', border: '#ec4899' },
    'PROMOCAO':            { bg: 'rgba(236,72,153,0.15)',  text: '#f9a8d4', border: '#ec4899' },
    'EVENTO COMEMORATIVO': { bg: 'rgba(217,70,239,0.15)',  text: '#f0abfc', border: '#d946ef' },
    'INAUGURAÇÃO':         { bg: 'rgba(225,29,72,0.15)',   text: '#fda4af', border: '#e11d48' },
    'INAUGURACAO':         { bg: 'rgba(225,29,72,0.15)',   text: '#fda4af', border: '#e11d48' },
  };
  return map[t] || { bg: 'rgba(100,116,139,0.15)', text: '#cbd5e1', border: '#64748b' };
}

function renderAgenda() {
  if (state.loading.agenda) return renderLoading('Carregando agenda…');
  if (state.errors.agenda) return renderError();

  const list = state.data.agenda || [];
  const today = new Date();
  const dateLabel = today.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' });

  if (list.length === 0) {
    return `
      <div class="flex-1 flex flex-col items-center justify-center text-center">
        <div class="text-9xl mb-6">🎉</div>
        <div class="text-5xl font-black text-white mb-3">Agenda livre hoje!</div>
        <div class="text-xl text-slate-400">Nenhum compromisso programado para ${escapeHtml(dateLabel)}</div>
      </div>
    `;
  }

  // Find next upcoming
  const nowMinutes = today.getHours() * 60 + today.getMinutes();
  let nextIdx = -1;
  for (let i = 0; i < list.length; i++) {
    const t = list[i].hora_inicio;
    if (!t) continue;
    const [hh, mm] = String(t).split(':').map(Number);
    const minutes = (hh || 0) * 60 + (mm || 0);
    if (minutes >= nowMinutes) { nextIdx = i; break; }
  }

  const rows = list.map((item, i) => {
    const c = tipoColor(item.tipo);
    const isNext = i === nextIdx;
    const isDone = String(item.status || '').toUpperCase() === 'REALIZADO';

    const rowStyle = isNext
      ? 'border-left: 4px solid #f97316; background: rgba(249,115,22,0.06); box-shadow: 0 0 24px -4px rgba(249,115,22,0.25);'
      : 'border-left: 4px solid transparent;';

    const muted = isDone ? 'opacity:0.45; text-decoration:line-through;' : '';

    const responsibles = Array.isArray(item.responsaveis)
      ? item.responsaveis.join(', ')
      : (item.responsaveis || '');

    return `
      <div class="card flex items-center gap-6 px-6 py-4" style="${rowStyle}">
        <div class="text-3xl font-black text-white tabular-nums w-24" style="${muted}">${escapeHtml(formatTime(item.hora_inicio))}</div>
        <div class="w-44">
          <span class="badge" style="background:${c.bg}; color:${c.text}; border:1px solid ${c.border}40;">${escapeHtml(item.tipo || '—')}</span>
        </div>
        <div class="flex-1 min-w-0" style="${muted}">
          <div class="text-xl font-bold text-white truncate">${escapeHtml(item.cliente_nome || 'Sem cliente')}</div>
          ${item.local ? `<div class="text-sm text-slate-400 truncate">📍 ${escapeHtml(item.local)}</div>` : ''}
        </div>
        <div class="text-right" style="${muted}">
          <div class="text-xs uppercase tracking-widest text-slate-500">Responsável</div>
          <div class="text-base font-semibold text-slate-200 truncate max-w-xs">${escapeHtml(responsibles || '—')}</div>
        </div>
        ${isNext ? '<div class="badge" style="background:rgba(249,115,22,0.2);color:#fdba74;border:1px solid #f9731640;">PRÓXIMO</div>' : ''}
      </div>
    `;
  }).join('');

  return `
    <div class="flex items-end justify-between mb-4">
      <div>
        <div class="text-xs uppercase tracking-[0.3em] text-slate-500 font-bold">Compromissos</div>
        <div class="text-3xl font-bold text-white mt-1">Agenda · ${escapeHtml(dateLabel)}</div>
      </div>
      <div class="text-right">
        <div class="text-xs uppercase tracking-widest text-slate-500">Total</div>
        <div class="text-2xl font-black text-brand tabular-nums">${list.length}</div>
      </div>
    </div>
    <div class="flex flex-col gap-3 flex-1 min-h-0 overflow-hidden">
      ${rows}
    </div>
  `;
}

/* ---------- Screen 3: Rotas ---------- */
function renderRotas() {
  if (state.loading.rotas) return renderLoading('Carregando rotas…');
  if (state.errors.rotas) return renderError();

  const list = state.data.rotas || [];
  const hoje = diaDaSemanaHoje();
  // Capitalize: "Quinta-feira"
  const diaLabel = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'][new Date().getDay()];

  const turnos = { 'MANHÃ': [], 'TARDE': [], 'NOITE': [] };

  for (const r of list) {
    const schedule = Array.isArray(r.schedule) ? r.schedule : [];
    for (const entry of schedule) {
      if (!entry) continue;
      const dia = String(entry.dia || '').toUpperCase();
      const turno = String(entry.turno || '').toUpperCase();
      // Normalize MANHA/MANHÃ etc.
      const turnoKey =
        turno === 'MANHA' || turno === 'MANHÃ' ? 'MANHÃ' :
        turno === 'TARDE' ? 'TARDE' :
        turno === 'NOITE' ? 'NOITE' : null;
      const diaKey = dia === 'TERCA' ? 'TERÇA' : dia === 'SABADO' ? 'SÁBADO' : dia;
      if (diaKey === hoje && turnoKey) {
        turnos[turnoKey].push(r.name);
      }
    }
  }

  // Dedup each turno
  for (const k of Object.keys(turnos)) {
    turnos[k] = [...new Set(turnos[k])].sort();
  }

  const totalRotas = turnos['MANHÃ'].length + turnos['TARDE'].length + turnos['NOITE'].length;

  const renderTurno = (key, emoji, color, bgGrad) => {
    const rotas = turnos[key];
    const pills = rotas.length === 0
      ? `<div class="text-slate-500 italic mt-4">Sem saídas</div>`
      : rotas.map(name => `
          <div class="px-5 py-3 rounded-xl text-lg font-bold text-white text-center"
               style="background:${color}20; border:1px solid ${color}60;">
            ${escapeHtml(name)}
          </div>
        `).join('');
    return `
      <div class="card flex-1 flex flex-col p-6 relative overflow-hidden min-h-0">
        <div class="absolute top-0 left-0 right-0 h-1" style="background:${color}"></div>
        <div class="flex items-center gap-3 mb-5">
          <div class="text-4xl">${emoji}</div>
          <div>
            <div class="text-2xl font-black uppercase tracking-wider" style="color:${color}">${key}</div>
            <div class="text-xs text-slate-500 uppercase tracking-widest">${rotas.length} rota${rotas.length !== 1 ? 's' : ''}</div>
          </div>
        </div>
        <div class="flex flex-col gap-2 overflow-hidden flex-1">${pills}</div>
      </div>
    `;
  };

  return `
    <div class="flex items-end justify-between mb-4">
      <div>
        <div class="text-xs uppercase tracking-[0.3em] text-slate-500 font-bold">Logística</div>
        <div class="text-3xl font-bold text-white mt-1">Rotas · ${escapeHtml(diaLabel)}</div>
      </div>
      <div class="text-right">
        <div class="text-xs uppercase tracking-widest text-slate-500">Saindo hoje</div>
        <div class="text-3xl font-black text-brand tabular-nums">${totalRotas}</div>
      </div>
    </div>
    <div class="grid grid-cols-3 gap-6 flex-1 min-h-0">
      ${renderTurno('MANHÃ', '🌅', '#f59e0b', 'amber')}
      ${renderTurno('TARDE', '☀️', '#3b82f6', 'blue')}
      ${renderTurno('NOITE', '🌙', '#6366f1', 'indigo')}
    </div>
  `;
}

  return { color: '#64748b', bg: 'rgba(100,116,139,0.15)', border: '#64748b', label: c || '—' };

/* ---------- Slide rendering ---------- */
function renderCurrentSlide() {
  const screen = SCREENS[state.currentSlide];
  const content = document.getElementById('slide-content');
  const screenName = document.getElementById('screen-name');
  const screenCurrent = document.getElementById('screen-current');

  let html = '';
  switch (screen.id) {
    case 'pedidos': html = renderPedidos(); break;
    case 'agenda':  html = renderAgenda(); break;
    case 'rotas':   html = renderRotas(); break;
    case 'visitas': html = renderVisitas(); break;
    case 'alertas': html = renderAlertas(); break;
  }

  content.innerHTML = html;
  screenName.textContent = screen.name;
  screenCurrent.textContent = state.currentSlide + 1;
  renderDots();
}

function renderDots() {
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = SCREENS.map((s, i) =>
    `<div class="dot ${i === state.currentSlide ? 'active' : ''}" data-idx="${i}" title="${s.name}"></div>`
  ).join('');
  dotsEl.querySelectorAll('.dot').forEach(el => {
    el.addEventListener('click', () => {
      const idx = Number(el.dataset.idx);
      goToSlide(idx);
      resetRotation();
    });
  });
}

function goToSlide(n) {
  const total = SCREENS.length;
  const target = ((n % total) + total) % total;
  if (target === state.currentSlide) return;

  const content = document.getElementById('slide-content');
  content.classList.add('fading');
  setTimeout(() => {
    state.currentSlide = target;
    renderCurrentSlide();
    requestAnimationFrame(() => content.classList.remove('fading'));
  }, 400);
}

function startRotation() {
  if (state.rotationTimer) clearInterval(state.rotationTimer);
  state.rotationTimer = setInterval(() => {
    goToSlide(state.currentSlide + 1);
  }, SLIDE_DURATION);
}

function resetRotation() {
  startRotation();
}

/* ---------- Clock ---------- */
function updateClock() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  const ss = String(d.getSeconds()).padStart(2, '0');
  document.getElementById('clock-time').textContent = `${hh}:${mm}:${ss}`;
  document.getElementById('clock-date').textContent = formatLongDate();
}

function startClock() {
  updateClock();
  state.clockTimer = setInterval(updateClock, 1000);
}

/* ---------- Init ---------- */
function init() {
  document.getElementById('screen-total').textContent = SCREENS.length;
  startClock();
  renderCurrentSlide();   // show initial loading state
  fetchAll();
  setInterval(fetchAll, REFRESH_INTERVAL);
  startRotation();

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') {
      goToSlide(state.currentSlide - 1);
      resetRotation();
    } else if (e.key === 'ArrowRight') {
      goToSlide(state.currentSlide + 1);
      resetRotation();
    } else if (e.key === 'r' || e.key === 'R') {
      fetchAll();
    }
  });
}

async function bootstrap() {
  await initPin();
  // Se já autenticado, inicia o dashboard imediatamente;
  // caso contrário, o botão de desbloqueio chama startDashboard()
  const mainApp = document.getElementById('main-app');
  if (mainApp.style.display !== 'none') {
    init();
  } else {
    // Sobrescreve tryUnlock para também iniciar o dashboard
    const origStyle = mainApp.getAttribute('style');
    const observer = new MutationObserver(() => {
      if (!mainApp.style.display || mainApp.style.display === '') {
        observer.disconnect();
        init();
      }
    });
    observer.observe(mainApp, { attributes: true, attributeFilter: ['style'] });
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootstrap);
} else {
  bootstrap();
}
</script>
